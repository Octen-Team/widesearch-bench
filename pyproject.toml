[project]
name = "widesearch-bench"
version = "0.1.0"
description = "Reference dataset and evaluation harness for multi-entity web search configurations"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["httpx>=0.27", "anthropic>=0.40"]

[project.optional-dependencies]
analysis = ["numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
widesearch = "widesearch_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
